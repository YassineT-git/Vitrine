name: Publication du portfolio

# Publier les fichiers tels quels après chaque mise à jour de main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  prepare:
    name: Préparer les fichiers HTML, CSS et JavaScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers à publier
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    name: Publier sur GitHub Pages
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le portfolio
        id: deployment
        uses: actions/deploy-pages@v4
